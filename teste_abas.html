<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Sistema de Abas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .tab-navigation { margin-bottom: 20px; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-button { padding: 10px 20px; background: #f0f0f0; border: 1px solid #ccc; cursor: pointer; }
        .tab-button.active { background: #007bff; color: white; }
        .tab-content { display: none; padding: 20px; border: 1px solid #ccc; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <h1>Teste do Sistema de Abas</h1>

    <div class="tab-navigation">
        <div class="tab-buttons">
            <button class="tab-button" data-tab="instituicao">Instituição</button>
            <button class="tab-button" data-tab="historia">História</button>
            <button class="tab-button" data-tab="estatutos">Estatutos</button>
            <button class="tab-button active" data-tab="diretoria">Diretoria</button>
        </div>

        <div class="tab-content active" id="tab-instituicao">
            <h2>Instituição</h2>
            <p>Conteúdo da aba Instituição</p>
        </div>

        <div class="tab-content" id="tab-historia">
            <h2>História</h2>
            <p>Conteúdo da aba História</p>
        </div>

        <div class="tab-content" id="tab-estatutos">
            <h2>Estatutos</h2>
            <p>Conteúdo da aba Estatutos - Esta aba deveria aparecer quando clicada</p>
        </div>

        <div class="tab-content active" id="tab-diretoria">
            <h2>Diretoria</h2>
            <p>Conteúdo da aba Diretoria (ativa por padrão)</p>
        </div>
    </div>

    <script>
        // Sistema de abas simplificado para teste
        function showTab(tabId) {
            // Esconder todos os conteúdos
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
                tab.classList.remove('active');
            });

            // Remover classe active de todos os botões
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Mostrar conteúdo da aba selecionada
            const activeTab = document.getElementById(`tab-${tabId}`);
            const activeButton = document.querySelector(`.tab-button[data-tab="${tabId}"]`);

            if (activeTab && activeButton) {
                activeTab.style.display = 'block';
                activeTab.classList.add('active');
                activeButton.classList.add('active');
            }
        }

        // Inicializar sistema de abas
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');
                if (tabId) {
                    showTab(tabId);
                }
            });
        });
    </script>
</body>
</html>
